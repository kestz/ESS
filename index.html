<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashomba Electrical System - Login</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#DAA520">
    
    <!-- Apple iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Kashomba">
    <link rel="apple-touch-icon" href="assets/logo.png">
    
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#DAA520">
    <meta name="msapplication-TileImage" content="assets/logo.png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    
    <!-- Login Container -->
    <div class="login-container">
        
        <!-- Login Card -->
        <div class="login-card">
            
            <!-- Logo Section -->
            <div class="login-logo">
                <img src="assets/logo.png" alt="Kashomba Electrical" class="login-logo-img" onerror="this.style.display='none'">
                <h1 class="login-company-name">KASHOMBA</h1>
                <p class="login-company-tagline">ELECTRICAL SOLUTION</p>
            </div>
            
            <!-- Error Message -->
            <div id="loginError" class="login-error" style="display: none;"></div>
            
            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                
                <!-- Username -->
                <div class="form-group">
                    <label for="userName">Username</label>
                    <input type="text" id="userName" class="form-input" placeholder="Enter your full name or user ID" required autocomplete="off">
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" class="form-input" placeholder="Enter your password" required>
                </div>
                
                <!-- Login Button -->
                <button type="submit" id="loginButton" class="btn-login">
                    <span class="btn-text">Login to System</span>
                </button>
                
            </form>
            
            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; 2026 Kashomba Electrical Solution. All rights reserved.</p>
            </div>
            
        </div>
        
    </div>
    
    <!-- JavaScript - ORDER NI MUHIMU -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameValue = document.getElementById('userName').value.trim();
            const passwordValue = document.getElementById('userPassword').value;
            
            // Validate
            if (!usernameValue || !passwordValue) {
                showLoginError('Please enter both username and password');
                return;
            }
            
            // handleLogin tayari ina loading state na double-click prevention
            const success = await handleLogin(usernameValue, passwordValue);
            
            if (success) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch(function(err) {
                        console.log('Service Worker registration failed:', err);
                    });
            });
        }
    </script>
    
</body>
</html>
